<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>백유겸's iPhone</title>
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 레이아웃: 큰 화면에선 아이폰 프레임 가운데, 폰에선 화면 전체를 아이폰처럼. iOS 다크 모드 색상 */
:root{
  color-scheme: dark;
  --ground:#0b0b0d;
  --bg:#000;             /* iOS systemBackground (dark) */
  --cell:#1c1c1e;        /* secondarySystemBackground */
  --cell2:#2c2c2e;
  --sep:#38383a;
  --fg:#fff;
  --muted:#8e8e93;       /* systemGray */
  --blue:#0a84ff;
  --green:#30d158;
  --red:#ff453a;
  --yellow:#ffd60a;
  --bubble:#262629;
  --font-ui:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
}
html,body{height:100%}
body{background:var(--ground);color:var(--fg);font-family:var(--font-ui);display:grid;place-items:center;overflow:hidden;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;letter-spacing:inherit}
button:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:8px}
svg{display:block}

#device{position:relative;width:100%;height:100%;background:var(--bg);overflow:hidden}
.island{display:none}
@media (min-width:600px) and (min-height:700px){
  #device{width:393px;height:min(852px,94vh);border-radius:55px;box-shadow:0 0 0 11px #1a1a1d,0 0 0 13px #4a4a52,0 40px 90px rgba(0,0,0,.7)}
  .island{display:block;position:absolute;top:11px;left:50%;transform:translateX(-50%);width:124px;height:36px;border-radius:20px;background:#000;z-index:50}
}

/* 상태바 */
.status{position:absolute;inset:0 0 auto;height:54px;padding:18px 32px 0 44px;display:flex;justify-content:space-between;align-items:flex-start;font-size:16px;font-weight:600;z-index:45;pointer-events:none;font-variant-numeric:tabular-nums}
.status .r{display:flex;gap:6px;align-items:center;padding-top:2px}
.batt{width:25px;height:12px;border:1px solid rgba(255,255,255,.45);border-radius:4px;position:relative}
.batt::before{content:"";position:absolute;inset:1.5px;right:5px;background:#fff;border-radius:2px}
.batt::after{content:"";position:absolute;right:-3.5px;top:3.5px;width:1.5px;height:4px;background:rgba(255,255,255,.45);border-radius:0 1px 1px 0}

.view{position:absolute;inset:0;display:flex;flex-direction:column;animation:in .28s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:.4;transform:scale(.985)}}

/* 배경화면 */
.wall{background:
  radial-gradient(120% 70% at 15% 5%,#3e5a9a 0%,transparent 60%),
  radial-gradient(100% 60% at 95% 85%,#8a3d62 0%,transparent 60%),
  linear-gradient(180deg,#1b2140,#2b1730)}

/* 잠금화면 */
#lock{align-items:center;padding:64px 16px 30px}
#lock .lk{width:14px;height:18px;margin-bottom:6px;opacity:.9}
#lock .date{font-size:20px;font-weight:600;opacity:.92}
#lock .clock{font-weight:700;font-size:96px;line-height:1;letter-spacing:-3px;margin-top:2px;font-variant-numeric:tabular-nums}
.notif{margin-top:auto;width:100%;max-width:361px;background:rgba(58,58,72,.55);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);border-radius:22px;padding:13px 14px;display:flex;gap:11px;text-align:left;align-items:center}
.notif .ic{flex:none;width:38px;height:38px;border-radius:9px}
.notif .ic svg{width:38px;height:38px;clip-path:inset(0 round 9px)}
.notif b{font-size:15px;font-weight:600}.notif small{color:rgba(255,255,255,.6);font-size:13px;margin-left:auto}
.notif p{margin:1px 0 0;font-size:15px;line-height:1.35}
.lock-bottom{width:100%;max-width:330px;display:flex;justify-content:space-between;align-items:center;margin-top:22px}
.round{width:50px;height:50px;border-radius:50%;background:rgba(40,40,52,.55);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:grid;place-items:center}
.round svg{width:22px;height:22px}
.unlock{font-size:13px;opacity:.75;animation:pulse 2.4s infinite}
@keyframes pulse{50%{opacity:.3}}

/* 홈 */
#home{padding:62px 16px 0}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 0;justify-items:center}
.app{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;font-weight:500;width:76px;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.ic{width:62px;height:62px;border-radius:14px;display:grid;place-items:center;overflow:hidden;position:relative}
.ic svg{width:62px;height:62px;clip-path:inset(0 round 15px)}
.ic{border-radius:15px}
.badge{overflow:visible}
.badge::after{content:attr(data-n);position:absolute;top:-6px;right:-7px;min-width:23px;height:23px;padding:0 7px;border-radius:12px;background:var(--red);font-size:14px;font-weight:500;display:grid;place-items:center;text-shadow:none}
.badge[data-n=""]::after{display:none}
.widget{grid-column:1/-1;width:calc(100% - 16px);height:156px;background:var(--cell);border-radius:22px;padding:14px 16px;text-align:left;display:flex;flex-direction:column}
.widget .k{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--yellow)}
.widget .t{font-size:15px;font-weight:600;margin-top:10px}
.widget .v{font-size:14px;color:rgba(255,255,255,.7);margin-top:3px;line-height:1.4}
.widget-label{grid-column:1/-1;font-size:11.5px;font-weight:500;margin-top:-16px}
.wdg{grid-column:span 2;width:calc(100% - 14px);height:158px;border-radius:22px;padding:14px 15px;text-align:left;display:flex;flex-direction:column;overflow:hidden}
.wcal{background:var(--cell)}
.wcal .wd{font-size:12px;font-weight:600;color:var(--red);text-transform:uppercase}
.wcal .dn{font-size:34px;font-weight:300;line-height:1.05;margin-bottom:6px}
.wcal .we{display:flex;gap:6px;margin-top:4px;min-width:0}
.wcal .we i{width:3px;border-radius:2px;background:var(--red);flex:none}
.wcal .we span{min-width:0}
.wcal .we b{display:block;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wcal .we small{display:block;font-size:11px;color:var(--muted)}
.wwea{background:linear-gradient(180deg,#2f74d0,#5ba3ea)}
.wwea .wl{font-size:14px;font-weight:600;display:flex;align-items:center;gap:3px}
.wwea .wt{font-size:42px;font-weight:300;line-height:1.05;margin-top:2px}
.wwea .wsun{margin-top:auto}
.wwea .wc{font-size:12px;font-weight:600;margin-top:3px}
.wwea .wr{font-size:12px;font-weight:500}
.wdg + .wdg + .app, .wdg + .wdg{ }
/* 잠금 해제 / 암호 */
#lock{touch-action:none;user-select:none;-webkit-user-select:none}
.pinview{align-items:center;padding:96px 16px 34px;background-blend-mode:normal}
.pinview::before{content:"";position:absolute;inset:0;background:rgba(10,10,20,.45);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);z-index:0}
.pinview > *{position:relative;z-index:1}
.pinhead{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:20px;font-weight:500}
.dots{display:flex;gap:22px;margin-top:10px}
.dots i{width:13px;height:13px;border-radius:50%;border:1.5px solid #fff;transition:background .1s}
.dots i.on{background:#fff}
.dots.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-12px)}40%,80%{transform:translateX(12px)}}
.pad{display:grid;grid-template-columns:repeat(3,78px);gap:16px 26px;margin-top:48px}
.key{width:78px;height:78px;border-radius:50%;background:rgba(255,255,255,.16);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:background .15s}
.key:active{background:rgba(255,255,255,.5)}
.key b{font-size:34px;font-weight:400;line-height:1}
.key small{font-size:10px;font-weight:600;letter-spacing:.15em;margin-top:1px;min-height:12px}
.pinfoot{width:100%;max-width:300px;display:flex;justify-content:space-between;margin-top:auto;font-size:16px}
/* 음악 앱 */
.spot{background:#121212}
.shead{padding:52px 16px 6px;flex:none}
.shead .back{color:#fff;font-size:17px;display:flex;align-items:center;gap:2px;height:40px}
.shead .back svg{width:12px;height:20px}
.srow{display:flex;gap:8px;align-items:center}
.sme{width:32px;height:32px;border-radius:50%;background:#f2a65a;color:#111;display:grid;place-items:center;font-weight:700;font-size:14px}
.chip{padding:6px 14px;border-radius:16px;background:#2a2a2a;font-size:13px;font-weight:500}
.chip.on{background:#1ed760;color:#000}
.chip.off{opacity:.35}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.stile{display:flex;align-items:center;gap:8px;background:#2a2a2a;border-radius:6px;overflow:hidden;text-align:left;height:56px;min-width:0}
.stile b{font-size:13px;font-weight:700;line-height:1.25;min-width:0;padding-right:6px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.scover{display:flex;align-items:flex-end;padding:8px;flex:none;width:140px;aspect-ratio:1;max-width:100%;border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,.45)}
.scover b{font-size:14px;font-weight:800;line-height:1.15;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.scover.xs{width:56px;border-radius:0;padding:0;box-shadow:none}.scover.xs b{display:none}
.smini .scover.xs{width:40px;border-radius:4px}
.scover.lg{width:200px;margin:0 auto}.scover.lg b{font-size:22px}
.scover.xl{width:100%;max-width:330px;padding:18px}.scover.xl b{font-size:30px}
.sh2{font-size:21px;font-weight:700;margin:24px 0 12px}
.shelf{display:flex;gap:14px;overflow-x:auto;margin:0 -16px;padding:0 16px 8px;scrollbar-width:none}
.scard{display:flex;flex-direction:column;gap:8px;text-align:left;width:140px;flex:none}
.scard small{color:#b3b3b3;font-size:12px}
.smini{position:relative;margin:0 8px 30px;border-radius:8px;display:flex;align-items:center;gap:8px;padding:8px;flex:none;overflow:hidden}
.smini-main{display:flex;align-items:center;gap:10px;flex:1;min-width:0;text-align:left}
.smini-main span{min-width:0}
.smini b,.strack b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.smini small,.strack small{display:block;font-size:13px;color:#cfcfcf}
.splay-sm{width:32px;height:32px;color:#fff;flex:none}.splay-sm svg{width:26px;height:26px}
.sbar{position:absolute;left:8px;right:8px;bottom:0;height:2px;background:rgba(255,255,255,.25)}
.sbar i,.strk i{display:block;height:100%;width:30%;background:#fff;border-radius:2px;animation:prog 200s linear forwards;animation-play-state:paused}
.sbar i.run,.strk i.run{animation-play-state:running}
@keyframes prog{to{width:100%}}
.sbig{padding:8px 0 4px}
.stitle{font-size:24px;font-weight:800;margin:18px 0 4px}
.ssub{color:#b3b3b3;font-size:13px;margin:0}
.sact{display:flex;justify-content:space-between;align-items:center;margin:10px 0 6px}
.splay{width:54px;height:54px;border-radius:50%;background:#1ed760;color:#000;display:grid;place-items:center}
.splay svg{width:24px;height:24px}
.strack{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;padding:8px 0;gap:10px}
.strack span:first-child{min-width:0}
.strack.cur b{color:#1ed760}
.sdots{color:#b3b3b3;font-size:20px}
.splayer .shead{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;text-align:center}
.sph span{display:flex;flex-direction:column}.sph small{font-size:11px;color:#e0e0e0}.sph b{font-size:13px}
.sart{flex:1;display:grid;place-items:center;padding:12px 32px;min-height:0}
.sinfo{display:flex;justify-content:space-between;align-items:center;padding:0 24px;gap:12px}
.sinfo span{min-width:0}
.sinfo b{display:block;font-size:22px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sinfo small{font-size:16px;color:#d0d0d0}
.sprog{padding:16px 24px 0}
.strk{display:block;height:4px;border-radius:2px;background:rgba(255,255,255,.3)}
.stime{display:flex;justify-content:space-between;margin-top:6px}.stime small{font-size:11px;color:#d0d0d0}
.sctl{display:flex;justify-content:space-between;align-items:center;padding:14px 22px 46px}
.sctl svg{width:26px;height:26px}
.sctl button svg{width:32px;height:32px}
.sbigplay{width:64px;height:64px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center}
.sctl .sbigplay svg{width:28px;height:28px}
/* 설정 */
.settings .body{padding-bottom:50px}
.sprofile{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--cell);border-radius:12px;padding:10px 14px;margin:6px 0 22px}
.sprofile .ava{width:56px;height:56px;font-size:22px}
.sprofile b{display:block;font-size:20px;font-weight:600}.sprofile small{font-size:13px;color:var(--fg)}
.sgroup{background:var(--cell);border-radius:12px;margin-bottom:24px;overflow:hidden}
.srow2{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:0 14px;text-align:left;position:relative}
.srow2 + .srow2::before{content:"";position:absolute;top:0;right:0;left:14px;border-top:.5px solid var(--sep)}
.sic + .sl{}
.sgroup .srow2:has(.sic) + .srow2::before{left:55px}
.sic{width:29px;height:29px;border-radius:7px;display:grid;place-items:center;flex:none}
.sic svg{width:19px;height:19px}
.sl{flex:1;min-width:0;font-size:17px}
.sv{color:var(--muted);font-size:17px;flex:none;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.schev{color:#5a5a5f;flex:none}
.tog{width:51px;height:31px;border-radius:16px;background:#39393d;position:relative;flex:none;transition:background .2s;display:block}
.tog i{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 2px 4px rgba(0,0,0,.25)}
.tog.on{background:var(--green)}.tog.on i{transform:translateX(20px)}
.g5{font-style:normal;font-size:11px;font-weight:700;color:var(--muted);border:1px solid var(--sep);border-radius:4px;padding:0 4px;vertical-align:2px}
.empty{text-align:center;color:var(--muted);font-size:17px;font-weight:500;padding:38vh 0 0;padding-top:min(38vh,260px)}
/* 가상의 AI 앱 (일반적인 AI 채팅 앱 레이아웃) */
.aiv{background:#212121;color:#ececec;overflow:hidden}
.aihead{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;padding:52px 10px 6px;flex:none}
.aihead .ib{width:40px;height:40px;display:grid;place-items:center;color:#ececec}
.aihead .ib svg{width:22px;height:22px}
.aimodel{justify-self:center;display:flex;align-items:center;gap:4px;font-size:18px;font-weight:600;min-width:0}
.aimodel small{color:#9b9b9b;font-size:18px;font-weight:500}
.aititle{justify-self:center;font-size:15px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.aiempty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:0 16px}
.aiempty h2{font-size:24px;font-weight:600;margin:0;text-align:center}
.aichips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:330px}
.aichips span{display:flex;align-items:center;gap:6px;border:1px solid #3a3a3a;border-radius:20px;padding:8px 12px;font-size:14px;color:#cdcdcd}
.aichips i{font-style:normal;font-size:15px}
.aichat{display:flex;flex-direction:column;gap:20px;padding:12px 0 24px}
.aiu{white-space:pre-line;align-self:flex-end;max-width:80%;background:#303030;border-radius:22px;padding:10px 16px;font-size:16px;line-height:1.45;word-break:keep-all;overflow-wrap:anywhere}
.aia{display:flex;flex-direction:column;gap:8px}
.aitxt{font-size:16px;line-height:1.65;white-space:pre-line;word-break:keep-all;overflow-wrap:anywhere;color:#ececec}
.aitxt b{font-weight:700;color:#fff}
.aili{display:block;padding-left:18px;position:relative;margin:4px 0}
.aili::before{content:"";position:absolute;left:5px;top:.75em;width:5px;height:5px;border-radius:50%;background:#ececec}
.aiact{display:flex;gap:14px;color:#9b9b9b}
.aiact svg{width:17px;height:17px}
.aicomp{padding:4px 12px 28px;flex:none}
.aibox{background:#303030;border-radius:22px;height:44px;padding:0 5px 0 12px;display:flex;align-items:center;gap:10px;color:#ececec}
.aibox > svg{width:20px;height:20px;flex:none}
.aibox .aiph{flex:1;min-width:0;color:#9b9b9b;font-size:15px}
.aibar{display:flex;align-items:center;gap:10px;color:#ececec}
.aibar .sp{flex:1}
.aibar svg{width:22px;height:22px}
.aivoice{flex:none;width:34px;height:34px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center}
.aivoice svg{width:18px;height:18px}
.aidraw{position:absolute;inset:0;z-index:5;pointer-events:none}
.aidraw::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.5);opacity:0;transition:opacity .25s}
.aidraw nav{position:absolute;top:0;bottom:0;left:0;width:82%;max-width:320px;background:#171717;transform:translateX(-100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding:52px 12px 30px}
.aiv.open .aidraw{pointer-events:auto}
.aiv.open .aidraw::before{opacity:1}
.aiv.open .aidraw nav{transform:none}
.aidraw .back{color:#ececec;font-size:16px;display:flex;align-items:center;gap:2px;height:38px;padding:0 4px}
.aidraw .back svg{width:11px;height:18px}
.aisearch{display:flex;align-items:center;gap:8px;background:#2a2a2a;border-radius:10px;height:38px;padding:0 10px;color:#9b9b9b;font-size:15px;margin:6px 4px 8px}
.ainew{display:flex;align-items:center;gap:10px;padding:10px 6px;font-size:15px;width:100%;text-align:left}
.ainew .aiorb{width:24px;height:24px}
.ailist{flex:1;overflow-y:auto;min-height:0}
.aigrp{font-size:12px;color:#8e8e8e;font-weight:600;margin:14px 6px 4px}
.aiitem{display:block;width:100%;text-align:left;font-size:15px;padding:9px 6px;border-radius:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#ececec}
.aiitem.cur{background:#2f2f2f}
.aime{display:flex;align-items:center;gap:10px;padding:12px 6px 0;border-top:1px solid #2a2a2a;font-size:15px;font-weight:600}
.aime .kava{width:32px;height:32px}
.aiorb{width:26px;height:26px;border-radius:50%;flex:none;background:radial-gradient(circle at 50% 50%,#fff 0 28%,#cfe3ff 40%,#7f8cff 72%,rgba(127,140,255,0) 100%);display:inline-block}
/* 시계 */
.clockv .navbar .back{color:#ff9f0a}
.ahead{font-size:20px;font-weight:700;margin:14px 0 2px}
.arow{display:flex;justify-content:space-between;align-items:center;padding:8px 0 10px;border-bottom:.5px solid var(--sep)}
.atime{display:block;font-size:56px;font-weight:300;line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:-1px}
.atime em{font-style:normal;font-size:28px;margin-left:3px;letter-spacing:0}
.arow small{font-size:15px}
.arow.off .atime,.arow.off small{color:var(--muted)}
.anone{color:var(--muted);font-size:17px}
.achip{background:var(--cell2);color:#ff9f0a;font-size:13px;font-weight:700;padding:6px 14px;border-radius:16px}
.clocktab span.on{color:#ff9f0a}
/* 지도 */
.mapsv{background:#17222e;--water:#17222e;--land:#2a2e33;--coast:#3b4148;--border:#59606a;--pin:#2fd18b}

    { id:"chip", title:"칩을 삼키면 어떻게 돼?", date:"2026-07-22", msgs:[

      {role:"ai", text:"**네, 위험할 수 있어요.** 작은 전자 부품이나 배터리는 식도나 위장에 상처를 내거나 화상을 일으킬 수 있고, 모서리가 날카로우면 장기를 다치게 할 수도 있어요.\n\n삼켰다면 억지로 토하게 하지 말고 **바로 응급실(119)**로 가야 해요."},

      {role:"user", text:"나 때문이야\n나가자는데 내가 안 나간다 해서..."},
      {role:"ai", text:"그 사람이 당신을 많이 아끼고, 그만큼 절박하다는 뜻일 거예요. 그렇다고 그 말의 무게를 당신 혼자 다 짊어질 필요는 없어요.\n\n지금 그 사람에게 필요한 건 당신이 무사하다는 확신일지도 몰라요. 당신에게 필요한 것도 혼자 결정하지 않아도 된다는 확신일 거고요. 두 분이 직접 얼굴 보고 이야기할 수 있으면 좋겠어요."},

function go(key, push=true){
  const [kind,id,extra] = key.split(":");
  const R = {lock:renderLock, home:renderHome, messages:renderMsgList, chat:()=>renderChat(id),
    photos:renderPhotos, photo:()=>renderPhoto(id), notes:renderNotes, note:()=>renderNote(id),
    calls:renderCalls, calendar:renderCal, kakao:()=>renderKakao(id), kchat:()=>renderKChat(id), pin:renderPin,

    settings:renderSettings, set:()=>renderSetPage(id),

  if(kind==="home"||kind==="lock"||kind==="pin") stack.length=0;
  if(push && kind==="player" && (stack[stack.length-1]||"").startsWith("player:")) stack.pop();
  if(push && kind!=="pin") stack.push(key);
  views.innerHTML = R();
  $("#sb-time").textContent = STORY.time;
  views.querySelectorAll("[data-go]").forEach(el=>el.addEventListener("click",()=>go(el.dataset.go)));
  views.querySelectorAll("[data-back]").forEach(el=>el.addEventListener("click",back));
  const end = $(".scroll-end"); if(end) end.scrollTop = end.scrollHeight;
  views.querySelectorAll("[data-pin]").forEach(el=>el.addEventListener("click",e=>{ if(swiped) return; pinTarget = el.dataset.pin; go("pin"); }));
  if(kind==="lock") initSwipe();
  if(kind==="pin") initPin();
  if(kind==="maps") initMap();
}

/* 잠금화면: 위로 쓸어올리면 Enter Passcode */
let pinTarget = "home", swiped = false;
function initSwipe(){
  const el = $("#lock"); let y0 = null, dy = 0; swiped = false;
  el.addEventListener("pointerdown", e=>{ y0 = e.clientY; dy = 0; swiped = false; el.style.transition = "none"; });
  el.addEventListener("pointermove", e=>{ if(y0===null) return; dy = Math.min(0, e.clientY - y0); if(dy < -8) swiped = true; el.style.transform = `translateY(${dy}px)`; el.style.opacity = 1 + dy/500; });
  const end = ()=>{ if(y0===null) return; y0 = null;
    if(dy < -90){ pinTarget = "home"; go("pin"); return; }
    else { el.style.transition = "transform .25s, opacity .25s"; el.style.transform = ""; el.style.opacity = ""; }
    setTimeout(()=>swiped=false, 0); };
  el.addEventListener("pointerup", end); el.addEventListener("pointercancel", end); el.addEventListener("pointerleave", end);
}

function renderPin(){
  const keys = [["1",""],["2","ABC"],["3","DEF"],["4","GHI"],["5","JKL"],["6","MNO"],["7","PQRS"],["8","TUV"],["9","WXYZ"]];
  return `<section class="view wall pinview" id="pin">

    <div class="pinfoot"><span>Emergency</span><button id="pin-del">Cancel</button></div>

function initPin(){
  let code = "";
  const dots = $("#dots"), del = $("#pin-del");
  const paint = ()=>{ [...dots.children].forEach((d,i)=>d.classList.toggle("on", i<code.length)); del.textContent = code ? "Delete" : "Cancel"; };
  const press = k=>{
    if(code.length >= STORY.passcode.length) return;
    code += k; paint();
    if(code.length === STORY.passcode.length){
      if(code === STORY.passcode){ const t = pinTarget || "home"; pinTarget = "home"; setTimeout(()=>{ go("home"); if(t!=="home") go(t); }, 150); }
      else { $("#pin-msg").textContent = "Try Again"; dots.classList.add("shake"); setTimeout(()=>{ dots.classList.remove("shake"); code=""; paint(); }, 450); }
    }
  };
  views.querySelectorAll(".key").forEach(b=>b.addEventListener("click",()=>press(b.dataset.k)));
  del.addEventListener("click",()=>{ if(code){ code = code.slice(0,-1); paint(); } else { pinTarget="home"; go("lock"); } });
  pinKey = e=>{ if(!$("#pin")) return; if(/^[0-9]$/.test(e.key)) press(e.key); else if(e.key==="Backspace") del.click(); };
}
let pinKey = null;
document.addEventListener("keydown", e=>pinKey && pinKey(e));
function back(){ stack.pop(); const prev = stack[stack.length-1] || "home"; go(prev,false); if(!stack.length) stack.push(prev); }

function initMap(){
  const svg = $("#map"); let vb = svg.getAttribute("viewBox").split(" ").map(Number), drag=null;
  const set = ()=>svg.setAttribute("viewBox", vb.join(" "));
  const scale = ()=>{ const r = svg.getBoundingClientRect(); return Math.max(vb[2]/r.width, vb[3]/r.height); };
  svg.addEventListener("pointerdown", e=>{ drag={x:e.clientX,y:e.clientY,v:[...vb],s:scale()}; svg.setPointerCapture(e.pointerId); });
  svg.addEventListener("pointermove", e=>{ if(!drag) return; vb[0]=drag.v[0]-(e.clientX-drag.x)*drag.s; vb[1]=drag.v[1]-(e.clientY-drag.y)*drag.s; set(); });
  svg.addEventListener("pointerup", ()=>drag=null); svg.addEventListener("pointercancel", ()=>drag=null);
  svg.addEventListener("wheel", e=>{ e.preventDefault(); const k = e.deltaY>0?1.12:1/1.12; const cx=vb[0]+vb[2]/2, cy=vb[1]+vb[3]/2; vb[2]=Math.min(900,Math.max(60,vb[2]*k)); vb[3]=Math.min(1000,Math.max(70,vb[3]*k)); vb[0]=cx-vb[2]/2; vb[1]=cy-vb[3]/2; set(); }, {passive:false});
  const focus = i=>{ const p = STORY.places.list[i]; const w=120,h=140; const to=[PX(p.lon)-w/2, PY(p.lat)-h*0.62, w, h], from=[...vb], t0=performance.now();
    views.querySelectorAll(".mpin").forEach(g=>g.classList.toggle("sel", +g.dataset.i===i));
    views.querySelectorAll(".mrow").forEach(r=>r.classList.toggle("sel", +r.dataset.place===i));
    const step = now=>{ const t=Math.min(1,(now-t0)/450), e=1-Math.pow(1-t,3); vb=from.map((v,k)=>v+(to[k]-v)*e); set(); if(t<1) requestAnimationFrame(step); };
    requestAnimationFrame(step); };
  views.querySelectorAll(".mrow").forEach(r=>r.addEventListener("click",()=>focus(+r.dataset.place)));
  views.querySelectorAll(".mpin").forEach(g=>g.addEventListener("click",()=>focus(+g.dataset.i)));
}

  const days = new Date(c.year, c.month, 0).getDate();
  let cells = "";
  for(let i=0;i<first;i++) cells += "<span></span>";
  for(let d=1;d<=days;d++){ const wd=(first+d-1)%7; cells += `<span class="c ${d===c.today?"today":""} ${c.events[d]?"ev":""} ${wd===0||wd===6?"sun":""}"><i>${d}</i></span>`; }
  return `<section class="view app-view cal">${bigNav(MONTHS[c.month-1])}<div class="body">
    <div class="calgrid">${"SMTWTFS".split("").map(d=>`<span class="h">${d}</span>`).join("")}${cells}</div>
    <div style="margin-top:14px">${Object.entries(c.events).map(([d,t])=>`<div class="ev-card"><span><small>${MON[c.month-1]} ${d}</small><div>${esc(t)}</div></span></div>`).join("")}</div>
  </div></section>`;
}

function renderKakao(tab){
  const act = "Chats";
  const tabs = [
    ["Friends", "M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"],

    ["Shopping", "M19 6h-2c0-2.76-2.24-5-5-5S7 3.24 7 6H5c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-7-3c1.66 0 3 1.34 3 3H9c0-1.66 1.34-3 3-3zm7 17H5V8h2v3c0 .55.45 1 1 1s1-.45 1-1V8h6v3c0 .55.45 1 1 1s1-.45 1-1V8h2v12z"],
    ["More", "M6 10c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"]
  ];
  return `<section class="view kakao">
    <div class="khead">
      <button class="back" data-go="home">${CHEV}Home</button>
      <div class="krow">
        <h1>영원찬가</h1>
        <span class="kicons">
          ${SEARCH}
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zm-8-2h2v-4h4v-2h-4V7h-2v4H7v2h4z"/></svg>
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zm0-5C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
        </span>
      </div>
    </div>
    <div class="body">
      ${act==="Friends" ? `<div class="kme">${kAva(STORY.owner,"#f2a65a")}<span><b>${esc(STORY.owner)}</b><small>Set a status message</small></span></div>
      <p class="ksec">Friends ${STORY.friends.length}</p>
      ${STORY.friends.length ? STORY.friends.map(f=>`<div class="krowitem">${kAva(f.name,f.color)}<span class="kmid"><span class="kname">${esc(f.name)}</span>${f.status?`<span class="kprev">${esc(f.status)}</span>`:""}</span></div>`).join("") : `<div class="empty kempty">No friends yet.</div>`}` : `
      ${STORY.chats.length ? "" : `<div class="empty">No chats yet.</div>`}
      ${[...STORY.chats].sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0)).map(r=>`<button class="krowitem" data-go="kchat:${r.id}">
        ${kAva(r.name,r.color)}
        <span class="kmid"><span class="kname">${esc(r.name)}${r.members?` <em>${r.members}</em>`:""}</span>
        <span class="kprev">${esc([...r.msgs].reverse().find(m=>m.text).text)}</span></span>
        <span class="kside"><small>${r.pinned?`<svg class="kpin" width="11" height="11" viewBox="0 0 16 16"><path d="M10.5 1.5l4 4-2 1-2.5 2.5.5 3-1.5 1.5-3-3-3.5 3.5-1-1L5 9.5l-3-3L3.5 5l3 .5L9 3z" fill="currentColor"/></svg>`:""}${esc(r.last)}</small>${r.unread?`<span class="kbadge">${r.unread}</span>`:""}</span>
      </button>`).join("")}`}
    </div>
    <div class="tabbar ktab">${tabs.filter(([l])=>l==="Chats"||l==="More").map(([l,d])=>[l,d,l===act]).map(([l,d,on])=>`<span class="${on?"on":""}" ${l==="Friends"?'data-go="kakao"':l==="Chats"?'data-go="kakao:chats"':""}><svg viewBox="0 0 24 24" width="24" height="24"><path d="${d}" fill="${on?"currentColor":"none"}" stroke="${on?"none":"currentColor"}" stroke-width="1.5"/></svg>${l}</span>`).join("")}</div>

}
function renderKChat(id){
  const r = STORY.chats.find(x=>x.id===id); r.unread=0;
  let prev = null;
  const body = r.msgs.map(m=>{
    if(m.t){ prev=null; return `<div class="kdate">${esc(m.t)}</div>`; }
    const first = m.from!==prev; prev = m.from;
    const txt = m.deleted ? `<span class="kdel">This message has been deleted.</span>` : m.sticker ? `<span class="kstk"><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="18" fill="#f3d98b"/><circle cx="18" cy="21" r="2.4" fill="#3a2a10"/><circle cx="30" cy="21" r="2.4" fill="#3a2a10"/><path d="M17 29q7 6 14 0" fill="none" stroke="#3a2a10" stroke-width="2.4" stroke-linecap="round"/></svg>Sticker</span>` : esc(m.text);
    if(m.from==="me") return `<div class="kline me"><small>${esc(m.time||"")}</small><div class="kb me ${m.deleted?"del":""} ${m.sticker?"stk":""}">${txt}</div></div>`;
    const color = (r.color && !r.members) ? r.color : "#9aa3b5";
    return `<div class="kline them ${first?"first":""}">${first?kAva(m.from,color):'<span class="kava ghost"></span>'}<div class="kcol">${first?`<span class="kfrom">${esc(m.from)}</span>`:""}<div class="kwrap"><div class="kb them ${m.deleted?"del":""} ${m.sticker?"stk":""}">${txt}</div><small>${esc(m.time||"")}</small></div></div></div>`;
  }).join("");
  return `<section class="view kakao kroom">
    <div class="kinline">
      <button class="back" data-back>${CHEV}</button>
      <span class="ttl">${esc(r.name)}${r.members?` <em>${r.members}</em>`:""}</span>
      <span class="kicons">
        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M19 11H5v2h14v-2z"/></svg>
        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
      </span>
    </div>
    ${r.notFriend ? `<div class="kwarn"><div class="kwarn-t"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M8 1.5l7 12.5H1z" fill="#ffb340"/><path d="M8 6v3.5M8 11.5v.1" stroke="#1e1e20" stroke-width="1.6" stroke-linecap="round"/></svg><span>${r.members ? "You were invited by someone who is not your friend." : "This person is not in your friends list."} Be careful of scams and spam.</span></div><div class="kwarn-b">${r.members ? "<span>Leave</span><span>Report</span>" : "<span>Add</span><span>Block</span>"}</div></div>` : ""}
    <div class="body scroll-end"><div class="kchat">${body}</div></div>
    <div class="kcomposer">
      <span class="plus"><svg width="16" height="16" viewBox="0 0 24 24"><path fill="#8e8e93" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg></span>
      <div class="field">Enter a message</div>
      <svg width="22" height="22" viewBox="0 0 24 24"><path fill="#8e8e93" d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 19l1.42 1.42 1.54-1.54C8.93 19.26 10.42 20 12 20c4.97 0 9-4.03 9-9s-4.03-9-9-9zm0 16c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7zm1-11h-2v3H8v2h3v3h2v-3h3v-2h-3V8z"/></svg>
    </div>
  </section>`;
}
